name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native architecture and compiler
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
      - name: Build and package tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package.sh "$RELEASE_TAG"
      - name: Run checks without modifying displays
        run: ./scripts/check.sh
      - name: Upload release files
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scalectl-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Deliberately do not check out or run repository code with write access.
      - name: Download checked release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scalectl-*
          merge-multiple: true
          path: dist
      - name: Verify both architectures and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for arch in arm64 x86_64; do
            test -f "dist/scalectl-${RELEASE_TAG}-macos-${arch}.tar.gz"
            test -f "dist/scalectl-${RELEASE_TAG}-macos-${arch}.tar.gz.sha256"
          done
          cd dist
          sha256sum --check *.sha256
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 \
            --repo "$RELEASE_REPO" --verify-tag --title "scalectl $RELEASE_TAG" \
            --generate-notes "${flags[@]}"
